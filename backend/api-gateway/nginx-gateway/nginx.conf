events {}

http {
  upstream user_service { server user-service:8000; }
  upstream catalog_service { server catalog-service:8000; }
  upstream inventory_service { server inventory-service:8000; }
  upstream search_service { server search-service:8000; }
  upstream cart_service { server cart-service:8000; }
  upstream order_service { server order-service:8000; }
  upstream payment_service { server payment-service:8000; }
  upstream shipping_service { server shipping-service:8000; }
  upstream return_review_service { server return-review-service:8000; }
  upstream marketing_notification_service { server marketing-notification-service:8000; }
  upstream ai_service { server ai-service:8000; }

  server {
    listen 8080;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location /api/users/ { 
      proxy_pass http://user_service/api/users/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/products/ { 
      proxy_pass http://catalog_service/api/products/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/categories/ { 
      proxy_pass http://catalog_service/api/categories/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/inventory/ { 
      proxy_pass http://inventory_service/api/inventory/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/search/ { 
      proxy_pass http://search_service/api/search/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/cart/ { 
      proxy_pass http://cart_service/api/cart/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/orders/ { 
      proxy_pass http://order_service/api/orders/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/payments/ { 
      proxy_pass http://payment_service/api/payments/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/shipping/ { 
      proxy_pass http://shipping_service/api/shipping/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/returns/ { 
      proxy_pass http://return_review_service/api/returns/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/reviews/ { 
      proxy_pass http://return_review_service/api/reviews/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/marketing/ { 
      proxy_pass http://marketing_notification_service/api/marketing/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/notifications/ { 
      proxy_pass http://marketing_notification_service/api/notifications/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ai/ { 
      proxy_pass http://ai_service/api/ai/; 
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      add_header Content-Type application/json;
      return 404 '{"detail":"Not found"}';
    }
  }
}